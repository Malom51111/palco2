<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0a0c11;--c1:#141821;--c2:#1c2230;--c3:#262e3f;--tx:#e9edf5;--mu:#8a93a8;--ac:#2f80ff;--gr:#2ecc71;--rd:#ff4d55;--ye:#f5c542;--or:#ff9f43;--pu:#a970ff;--line:#252c3b;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--c2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.h{font-family:Oswald,Inter,sans-serif;letter-spacing:.3px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + var(--sab))}
.top{position:sticky;top:0;z-index:20;background:rgba(10,12,17,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(8px + var(--sat)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sb{font-size:12px;color:var(--mu)}
.top .bal{margin-left:auto;text-align:right;font-weight:700;font-size:14px}
.top .bal small{display:block;font-weight:500;color:var(--mu);font-size:11px}
.gear{width:34px;height:34px;border-radius:50%;background:var(--c2);display:grid;place-items:center;font-size:16px;flex:none}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;padding:0 10px calc(8px + var(--sab));pointer-events:none}
.nav>div{pointer-events:auto;display:flex;background:rgba(28,34,48,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;padding:5px;gap:2px;width:100%;max-width:540px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:20px;font-size:11px;color:var(--mu);position:relative}
.nav button i{font-style:normal;font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.75}
.nav button.on{background:var(--c3);color:#fff}.nav button.on i{filter:none;opacity:1}
.dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--rd);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pg{padding:12px 12px 20px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:7px 13px;border-radius:18px;background:var(--c1);color:var(--mu);font-size:13px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.tabs button.on{background:var(--tx);color:#000;border-color:var(--tx)}
.card{background:var(--c1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
.gr{color:var(--gr)}.rd{color:var(--rd)}.ye{color:var(--ye)}.ac{color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--c3);font-weight:600;font-size:14px}
.btn.p{background:var(--ac);color:#fff}.btn.g{background:var(--gr);color:#04150a}.btn.r{background:rgba(255,77,85,.15);color:var(--rd)}.btn.w{width:100%}.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4}
.big{width:100%;padding:16px;border-radius:16px;font-size:17px;font-weight:800;background:linear-gradient(135deg,#2f80ff,#5b5bff);color:#fff;box-shadow:0 8px 24px rgba(47,128,255,.25);font-family:Oswald,Inter,sans-serif;letter-spacing:.6px}
.list>.it{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.list>.it:last-child{border-bottom:0}
.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{display:inline-block;min-width:34px;text-align:center;font-size:10px;font-weight:800;padding:3px 4px;border-radius:6px;color:#000}
.pos-POR{background:#f5c542}.pos-DEF,.pos-LAT{background:#4fa3ff}.pos-MED{background:#2ecc71}.pos-EXT,.pos-DEL{background:#ff6b6b}
.ovr{min-width:38px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;font-family:Oswald,Inter,sans-serif}
.ovr.wide{min-width:56px;font-size:12px}
.o1{background:#3a3f4b}.o2{background:#5c6b3a}.o3{background:#2d7a46}.o4{background:#1f6fd1}.o5{background:linear-gradient(135deg,#d4a017,#f5d36b);color:#201600}
.bar{height:6px;background:var(--c3);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--gr);border-radius:3px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--c3);color:var(--mu);margin-left:4px;vertical-align:middle}
.tag.r{background:rgba(255,77,85,.18);color:var(--rd)}.tag.g{background:rgba(46,204,113,.15);color:var(--gr)}.tag.y{background:rgba(245,197,66,.15);color:var(--ye)}.tag.b{background:rgba(47,128,255,.18);color:#7fb0ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--c2);border-radius:12px;padding:10px}.kpi .v{font-size:18px;font-weight:800;font-family:Oswald,Inter,sans-serif}.kpi .l{font-size:11px;color:var(--mu)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{background:var(--c1);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 14px calc(18px + var(--sab));border-top:1px solid var(--line);animation:su .2s}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--c3);margin:2px auto 10px}
.sheet h2{margin:0 0 4px;font-size:20px}
@keyframes su{from{transform:translateY(40px);opacity:.5}}@keyframes fi{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));z-index:90;background:#fff;color:#000;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:fi .2s}
.paper{background:#f3efe6;color:#111;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-family:Oswald,Inter,sans-serif;position:relative;overflow:hidden}
.paper .mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:3px double #111;padding-bottom:4px;margin-bottom:8px}
.paper .mast b{font-size:26px;font-weight:700;letter-spacing:1px;color:#c0161f;font-style:italic}
.paper .mast span{font-size:10px;font-family:Inter,sans-serif;color:#444}
.paper .hl{font-size:24px;line-height:1.05;font-weight:700;text-transform:uppercase}
.paper .sub{font-family:Inter,sans-serif;font-size:13px;color:#333;margin-top:4px}
.paper .more{display:flex;gap:10px;border-top:1px solid #bbb;margin-top:8px;padding-top:6px}
.paper .more div{flex:1;font-size:12px;line-height:1.15;font-weight:600}
.fx{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.fx .tm{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.fx .vs{font-family:Oswald,Inter,sans-serif;font-size:28px;font-weight:700;min-width:70px}
.in{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.in .ic{width:34px;height:34px;border-radius:10px;background:var(--c2);display:grid;place-items:center;flex:none;font-size:17px}
.in.unread .t{color:#fff}.in.unread .ic{box-shadow:0 0 0 2px var(--ac)}
.in .t{font-weight:700;font-size:14px;color:#c9d0de}
.in .d{font-size:12px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mu);font-weight:600;font-size:11px;text-align:right;padding:6px 3px}th:nth-child(2){text-align:left}
td{padding:7px 3px;text-align:right;border-top:1px solid var(--line)}td:nth-child(2){text-align:left}
tr.me td{background:rgba(47,128,255,.12)}
.zEu td:first-child{box-shadow:inset 3px 0 var(--gr)}.zRel td:first-child{box-shadow:inset 3px 0 var(--rd)}.zUp td:first-child{box-shadow:inset 3px 0 var(--ac)}
.step{display:flex;align-items:center;gap:6px}.step button{width:38px;height:38px;border-radius:10px;background:var(--c3);font-size:18px;font-weight:700;flex:none}.step input{text-align:center}

function ri(a,b){return Math.floor(a+R()*(b-a+1));}
function rf(a,b){return a+R()*(b-a);}
function pick(a){return a[Math.floor(R()*a.length)];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function gauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wpick(items,wf){let t=0;const ws=items.map(x=>{const w=Math.max(0,wf(x)||0);t+=w;return w;});if(t<=0)return items[Math.floor(R()*items.length)];let r=R()*t;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i];}return items[items.length-1];}
function fmt(v){const s=v<0?"-":"";v=Math.abs(v);if(v>=1e6)return s+(v/1e6).toFixed(v>=1e8?0:1).replace(".",",")+" M€";if(v>=1e3)return s+Math.round(v/1e3)+" k€";return s+Math.round(v)+" €";}
function niceRound(v){if(v<=0)return 0;if(v<1e4)return Math.round(v/100)*100;const m=Math.pow(10,Math.floor(Math.log10(v))-1);return Math.round(v/m)*m;}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function stripAcc(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"");}

const SEASON_WEEKS=34, LEAGUE_START=4, ROUNDS=30;
const WINDOWS=[[1,4],[17,20]];
const EURO_WEEKS={9:0,15:1,22:2,30:3};
const EURO_NAMES=["Octavos de final","Cuartos de final","Semifinales","Final"];
const EURO_NAME="Copa de Campeones de Europa";
const SQUAD_T={POR:3,DEF:5,LAT:4,MED:6,EXT:3,DEL:3};
const SAVE_KEY="palco_save_v1";

let G=null;
const uc=()=>G.clubs[G.user];
const isChair=()=>G.role==="chair";
const country=id=>COUNTRIES.find(c=>c.id===id);
const leagueOf=cid=>G.leagues.find(l=>l.cl.includes(cid));
const windowOpen=()=>WINDOWS.some(([a,b])=>G.week>=a&&G.week<=b);
const teamAvgFor=rep=>44+rep*0.38;

// ---------- jugadores ----------
function calcOvr(pos,a){const w=W[pos];let s=0;for(let i=0;i<8;i++)s+=w[i]*a[i];return Math.round(s);}
function genAttrs(pos,t){const w=W[pos],a=[];for(let i=0;i<8;i++){let b;if(w[i]>0)b=t+gauss()*5;else if(i===7)b=ri(5,18);else if(pos==="POR")b=t-25+gauss()*8;else b=t-14+gauss()*8;a.push(b);}
  let o=0;for(let i=0;i<8;i++)o+=w[i]*a[i];const d=t-o;for(let i=0;i<8;i++){if(w[i]>0)a[i]+=d;a[i]=clamp(Math.round(a[i]),5,99);}return a;}
function genName(nat){const g=NAMES[NATS[nat].g];return pick(g.f)+" "+pick(g.l);}
function rawValue(ovr){return 300000*Math.exp(0.205*(ovr-60));}
function calcValue(p){let v=rawValue(p.ovr);const a=p.age;const af=a<=19?1.25:a<=21?1.3:a<=24?1.2:a<=27?1.05:a<=29?.85:a<=31?.6:a<=33?.35:.18;
  if(a<=24)v*=1+Math.max(0,p.pot-p.ovr)*0.045;v*=af;
  if(p.club>=0){const yl=p.exp-G.season;if(yl<=0)v*=0.55;else if(yl===1)v*=0.85;}
  return niceRound(Math.max(10000,v));}
function baseWage(p){let w=rawValue(p.ovr)*0.009;if(p.age>=29)w*=1.15;if(p.age<=20)w*=0.6;return Math.max(400,w);}
function newSt(){return{ap:0,g:0,as:0,rt:0,mn:0,yc:0};}
function newPlayer(o){
  const id=G.nid++;const a=genAttrs(o.pos,o.ovr);
  const p={id,n:genName(o.nat),nat:o.nat,age:o.age,pos:o.pos,a,ovr:calcOvr(o.pos,a),pot:0,club:o.club,wage:0,exp:G.season+ri(0,3),clause:0,bA:0,bG:0,rs:0,
    mor:ri(60,80),fit:100,inj:0,sus:0,st:newSt(),car:{ap:0,g:0},listed:false,prom:0,val:0,yth:!!o.yth};
  let pot=p.ovr;const ag=o.age;
  if(ag<=20)pot+=Math.max(0,(23-ag)*2.4+gauss()*5);else if(ag<=24)pot+=Math.max(0,(25-ag)*1.4+gauss()*3);else pot+=Math.max(0,gauss()*1.5);
  if(o.pot)pot=o.pot;p.pot=clamp(Math.round(pot),p.ovr,97);
  p.val=calcValue(p);p.wage=niceRound(baseWage(p)*rf(.85,1.15));p.clause=niceRound(p.val*rf(1.8,3.5));
  G.P[id]=p;return p;}
function pickNat(cc){if(R()<0.72){const n={ESP:"ESP",ENG:"ENG",GER:"GER",ITA:"ITA",FRA:"FRA",POR:"POR",NED:"NED"}[cc];return n;}return pick(FOREIGN);}
function genSquad(club,avgO){
  club.pl=[];
  for(const pos of POS){const n=SQUAD_T[pos];const starters=FORMATIONS["4-3-3"][pos]||1;
    for(let i=0;i<n;i++){let age,ovr;
      if(i===n-1&&pos!=="POR"&&R()<0.7){age=ri(17,20);ovr=avgO-7+gauss()*3;}
      else if(i<starters){age=ri(21,32);ovr=avgO+2.5+gauss()*3;}
      else{age=ri(19,34);ovr=avgO-3.5+gauss()*3;}
      if(pos==="POR"&&i>0)ovr-=3;
      const p=newPlayer({pos,ovr:clamp(Math.round(ovr),30,92),age,nat:pickNat(club.cc),club:club.id});
      club.pl.push(p.id);}}
}
function newCoach(rep,club){
  const id=G.nid++;const b=rep*0.7+22;
  const c={id,n:pick(COACH_FIRST)+" "+pick(COACH_LAST),nat:pick(Object.keys(NATS)),age:ri(36,67),
    tac:clamp(Math.round(b+gauss()*7),25,97),mot:clamp(Math.round(b+gauss()*7),25,97),dev:clamp(Math.round(b+gauss()*10),20,97),disc:clamp(Math.round(b+gauss()*9),20,97),
    style:pick(Object.keys(PHIL)),form:pick(Object.keys(FORMATIONS)),rep:clamp(Math.round(rep+gauss()*6),10,99),wage:0,exp:G.season+ri(0,2),club,happy:70};
  c.wage=niceRound(800*Math.exp(c.rep/22));G.C[id]=c;return c;}
function coachRating(c){return Math.round((c.tac*0.45+c.mot*0.3+c.dev*0.1+c.disc*0.15));}

// ---------- clubes / mundo ----------
function clubName(c,city){for(let t=0;t<30;t++){const n=c.suf?city+" "+pick(c.suf):pick(c.pre)+" "+city;if(!BLACKLIST.has(n))return n;}return c.suf?city+" Borough":"Unión "+city;}
function shortName(n){const w=stripAcc(n).replace(/[^A-Za-z ]/g,"").split(" ").filter(x=>x.length>2&&!/^(FC|CD|UD|SD|CF|AC|AS|SS|US|SC|RC|AJ|SM|VV|SV|GD|AFC|DVS|TSV|VfB|VfL|FSV|SpVgg|Real|Club|United|City|Town|FC)$/i.test(x));
  const base=(w[0]||stripAcc(n).replace(/[^A-Za-z]/g,"")).toUpperCase();return base.slice(0,3);}
function infraFor(rep){const l=x=>clamp(Math.round(x),0,5);return{shop:l(rep/24),food:l(rep/26),ent:l(rep/32),med:clamp(l(rep/22),1,5),gym:clamp(l(rep/22),1,5),acad:clamp(l(rep/22),1,5),train:clamp(l(rep/22),1,5),boxes:l(rep/24)};}
function newClub(c,city,div,rep){
  const id=G.clubs.length;const c1=pick(PALETTE);let c2=pick(PALETTE);while(c2===c1)c2=pick(PALETTE);
  const name=clubName(c,city);
  const club={id,name,short:shortName(name),city,cc:c.id,div,rep,col:[c1,c2],crest:{s:ri(0,3),p:ri(0,4),y:ri(0,4)},coach:null,phil:"equilibrado",
    cap:div===1?Math.round((8000+rep*620+gauss()*4000)/500)*500:Math.round((2500+rep*260+gauss()*1500)/250)*250,infra:infraFor(rep),pl:[],fans:60,tvBase:0,adapt:1,user:false};
  club.cap=Math.max(2500,club.cap);
  G.clubs.push(club);genSquad(club,teamAvgFor(rep));
  const co=newCoach(rep,id);club.coach=co.id;club.phil=co.style;return club;}
function roundRobin(ids){const t=shuffle(ids.slice()),n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];m.push((r+i)%2===0?[a,b]:[b,a]);}rounds.push(m);t.splice(1,0,t.pop());}
  return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));}

function newWorld(){
  G={v:1,season:2026,week:1,nid:1,role:"dof",user:0,clubs:[],leagues:[],P:{},C:{},known:{},inbox:[],news:[],hist:[],champs:[],
    scouts:[],scoutPool:[],req:[],offIn:[],euro:null,fin:null,board:null,builds:[],over:null,neg:null,cool:{},lastUM:[],seen:{}};
  for(const c of COUNTRIES){const cities=shuffle(c.cities.slice());let ci=0;
    for(let div=1;div<=2;div++){const lg={id:c.id+div,cc:c.id,div,name:c.lg[div-1],cl:[],fx:[],res:[]};
      for(let r=0;r<16;r++){const rep=div===1?(91-r*2.5+gauss()*3)*c.k:(60-r*1.7+gauss()*3)*c.k;const cl=newClub(c,cities[ci++],div,clamp(Math.round(rep),12,99));lg.cl.push(cl.id);}
      G.leagues.push(lg);}}
  for(let i=0;i<16;i++)newCoach(ri(25,80),-1);
  // agentes libres
  for(let i=0;i<60;i++){const p=newPlayer({pos:pick(POS),ovr:ri(48,70),age:ri(20,34),nat:pick(FOREIGN),club:-1});p.exp=G.season;}
}

// arranque de partida
function startGame(role,clubId,custom){
  G.role=role;
  if(custom){clubId=createCustomClub(custom);}
  G.user=clubId;const c=uc();c.user=true;
  // finanzas
  const wb=wageBill(c);const rep=c.rep;
  G.fin={bal:custom?custom.budget:niceRound(Math.max(1.5e6,rep*rep*4200)),tb:0,wbud:0,ticket:0,refT:0,loans:[],sp:{main:null,kit:null},hist:[],wk:null,season:{inc:0,exp:0},lastAtt:0,neg:0};
  const cc=country(c.cc);G.fin.refT=Math.round(cc.tk*(c.div===1?1:0.55)*(0.7+rep/160));G.fin.ticket=G.fin.refT;
  // patrocinadores iniciales
  G.fin.sp.main={name:pick(SPONSOR_NAMES),amt:niceRound(wb*SEASON_WEEKS*0.2*rf(.9,1.1)),yrs:2};
  G.fin.sp.kit={name:pick(KIT_BRANDS),amt:niceRound(wb*SEASON_WEEKS*0.09*rf(.9,1.1)),yrs:2};
  calibrateTV(c);
  G.fin.tb=niceRound(Math.max(0,G.fin.bal*0.55));G.fin.wbud=niceRound(wb*1.15+G.fin.bal*0.002);
  G.board={conf:65,obj:null,target:10};
  G.scouts=[newScout(55),newScout(45)];refreshScoutPool();
  for(const lg of G.leagues){lg.fx=roundRobin(lg.cl);lg.res=[];}
  setupEuro(null);setObjective();
  refreshRequests();
  addInbox("Bienvenida",role==="chair"?`Has tomado el control de ${c.name} como Presidente. Tienes el control financiero total: bancos, presupuestos, patrocinadores e infraestructuras.`:`Te incorporas a ${c.name} como Director Deportivo. Contratas al entrenador, defines la filosofía y lideras la captación. La junta controla las finanzas.`,"info");
  addInbox("Objetivo de la junta",`La junta espera: <b>${G.board.obj}</b>. Confianza inicial: ${G.board.conf}%.`,"board");
  pushNews(`${c.name.toUpperCase()} ESTRENA NUEVA ERA EN EL PALCO`,role==="chair"?"El nuevo presidente promete ambición y cuentas saneadas":"El nuevo director deportivo ya trabaja en la planificación","club");
  G.lastUM=[];
}
function calibrateTV(c){const wb=wageBill(c);const hf=15/SEASON_WEEKS;const att=attendance();
  const others=att*G.fin.ticket*hf+c.infra.boxes*120000*(0.6+c.rep/100)*hf+c.infra.food*att*0.9*hf+retailInc(c)+(G.fin.sp.main.amt+G.fin.sp.kit.amt)/SEASON_WEEKS;
  const costs=wb+c.cap*1.1+Object.values(c.infra).reduce((s,l)=>s+l,0)*5000+(G.C[c.coach]?G.C[c.coach].wage:0)+30000;
  c.tvBase=niceRound(Math.max(wb*0.1,costs*1.04-others));}
function retailInc(c){const fanF=Math.max(0.3,c.cap/30000);return(c.infra.shop*35000+c.infra.food*12000+c.infra.ent*40000)*fanF*(0.6+c.rep/150);}
function createCustomClub(o){
  const lg=G.leagues.find(l=>l.cc===o.cc&&l.div===2);
  const victim=lg.cl.map(id=>G.clubs[id]).sort((a,b)=>a.rep-b.rep)[0];
  victim.pl.forEach(id=>{delete G.P[id];});
  victim.name=o.name;victim.short=(o.short||shortName(o.name)).toUpperCase().slice(0,3);victim.city=o.city||o.name;victim.col=[o.c1,o.c2];victim.crest={s:o.s,p:o.p,y:o.y};
  victim.rep=22;victim.cap=o.cap||3000;victim.infra={shop:0,food:0,ent:0,med:1,gym:1,acad:1,train:1,boxes:0};victim.fans=55;victim.custom=true;
  genSquad(victim,teamAvgFor(24));
  return victim.id;}

// ---------- plantilla / sueldos ----------
function wageBill(c){return c.pl.reduce((s,id)=>s+(G.P[id]?G.P[id].wage:0),0);}
function clubAvg(c){const o=c.pl.map(id=>G.P[id]).filter(Boolean).map(p=>p.ovr).sort((a,b)=>b-a).slice(0,14);return avg(o);}
function posCount(c,pos){return c.pl.filter(id=>G.P[id]&&G.P[id].pos===pos).length;}
function posNeed(c){let best=null,bs=-99;const a=clubAvg(c);for(const pos of POS){const ps=c.pl.map(id=>G.P[id]).filter(p=>p&&p.pos===pos);const lack=SQUAD_T[pos]-ps.length;const q=ps.length?Math.max(...ps.map(p=>p.ovr)):0;const s=lack*3+(a-q)/2+R()*2;if(s>bs){bs=s;best=pos;}}return best;}
function squadRank(c,p){const o=c.pl.map(id=>G.P[id]).filter(q=>q&&q.id!==p.id).map(q=>q.ovr);o.push(p.ovr);o.sort((a,b)=>b-a);return o.indexOf(p.ovr)+1;}
function roleOf(p){const c=G.clubs[p.club];if(!c)return"";const r=squadRank(c,p);if(p.age<=20&&r>11)return"Promesa";return r<=3?"Estrella":r<=11?"Titular":r<=16?"Rotación":"Suplente";}

// ---------- motor de partidos ----------
function pickXI(club){
  const coach=G.C[club.coach];const f=FORMATIONS[coach?coach.form:"4-4-2"];
  const avail=club.pl.map(id=>G.P[id]).filter(p=>p&&p.inj<=0&&p.sus<=0);
  const used=new Set(),xi=[];const sc=p=>p.ovr*(0.8+0.2*p.fit/100)+(p.prom>0?4:0);
  for(const pos of POS){const need=f[pos]||0;if(!need)continue;const c=avail.filter(p=>p.pos===pos).sort((a,b)=>sc(b)-sc(a));
    for(let i=0;i<need;i++){let p=c.find(q=>!used.has(q.id));
      if(!p){const alt=avail.filter(q=>!used.has(q.id)&&((pos==="POR")===(q.pos==="POR"))).sort((a,b)=>sc(b)-sc(a));p=alt[0]||avail.filter(q=>!used.has(q.id)).sort((a,b)=>sc(b)-sc(a))[0];}
      if(p){used.add(p.id);xi.push({p,pos});}}}
  return xi;}
function eff(p,slot){let o=p.ovr;if(p.pos!==slot){if(slot==="POR"||p.pos==="POR")o*=0.45;else if((slot==="DEF"&&p.pos==="LAT")||(slot==="LAT"&&p.pos==="DEF")||(slot==="EXT"&&p.pos==="DEL")||(slot==="DEL"&&p.pos==="EXT"))o*=0.94;else o*=0.86;}return o*(0.82+0.18*p.fit/100);}
function teamRatings(club,home){
  const xi=pickXI(club);const g={POR:[],DEF:[],MED:[],ATT:[]};
  xi.forEach(s=>{const e=eff(s.p,s.pos);if(s.pos==="POR")g.POR.push(e);else if(s.pos==="DEF"||s.pos==="LAT")g.DEF.push(e);else if(s.pos==="MED")g.MED.push(e);else g.ATT.push(e);});
  const all=g.DEF.concat(g.MED,g.ATT);const aM=g.MED.length?avg(g.MED):avg(all)*0.9,aA=g.ATT.length?avg(g.ATT):avg(all)*0.9,aD=g.DEF.length?avg(g.DEF):avg(all)*0.9;
  let gk=g.POR.length?g.POR[0]:25,def=aD*0.85+aM*0.15,mid=aM*0.75+avg(all)*0.25,att=aA*0.8+aM*0.2;
  const mor=avg(xi.map(x=>x.p.mor));const coach=G.C[club.coach];let m=1+(mor-60)/700;
  if(coach){m*=1+(coach.tac-60)/450+(coach.mot-60)/900;if(club.phil!==coach.style)m*=0.975;}else m*=0.95;
  m*=0.97+0.03*(club.adapt==null?1:club.adapt);if(home)m*=1.045;if(xi.length<11)m*=0.88;
  return{gk:gk*m,def:def*m,mid:mid*m,att:att*m,xi,phil:PHIL[club.phil]||PHIL.equilibrado,disc:coach?coach.disc:50};}
function simMatch(hId,aId,o){o=o||{};
  const hc=G.clubs[hId],ac=G.clubs[aId];const H=teamRatings(hc,!o.neutral),A=teamRatings(ac,false);const T=[H,A];
  const S=()=>({pt:0,ft:0,box:0,sh:0,sot:0,xg:0,g:0,fo:0,yc:0,rc:0,co:0});const s=[S(),S()];
  const ev=[],tl=o.rec?[]:null,goals={},asts={},yel={},cardsP={};const red=[0,0];const onP=[H.xi.map(x=>x),A.xi.map(x=>x)];
  const possH=clamp(0.5+(H.mid-A.mid)/110+H.phil.poss-A.phil.poss,0.25,0.75);
  const medU=[hc,ac].map(c=>c.user?c.infra.med:2);
  const len=90+ri(1,5);let m=0;
  function shot(side,long){const t=T[side],d=T[1-side],st=s[side];st.sh++;
    let xg=long?rf(0.015,0.06):(R()<0.08?rf(0.3,0.65):rf(0.03,0.14));if(!long)xg*=t.phil.xg*Math.pow(t.att/d.def,0.6);xg=clamp(xg,0.01,0.92);st.xg+=xg;
    const cand=onP[side].filter(x=>x.pos!=="POR");if(!cand.length)return;
    const sh=wpick(cand,x=>({DEL:3,EXT:2.2,MED:1.3,DEF:.45,LAT:.45}[x.pos])*Math.pow(x.p.a[3]/60,1.5));
    const fin=clamp(Math.pow((sh.p.a[3]*0.6+t.att*0.4)/(d.gk||50),0.8),0.6,1.35)*0.95;
    const goal=R()<xg*fin;if(goal||R()<0.33)st.sot++;
    if(goal){st.g++;goals[sh.p.id]=(goals[sh.p.id]||0)+1;let ast=null;
      if(R()<0.72){const c=onP[side].filter(x=>x.p.id!==sh.p.id&&x.pos!=="POR");if(c.length){ast=wpick(c,x=>({MED:3,EXT:3.2,DEL:1.6,LAT:1.5,DEF:.5}[x.pos])*x.p.a[2]/60).p.id;asts[ast]=(asts[ast]||0)+1;}}
      ev.push({m,t:"g",s:side,p:sh.p.id,a:ast,xg:+xg.toFixed(2)});}
    else if(xg>0.32)ev.push({m,t:"c",s:side,p:sh.p.id,xg:+xg.toFixed(2)});}
  for(m=1;m<=len;m++){
    const side=R()<possH?0:1,opp=1-side,t=T[side],d=T[opp],st=s[side];st.pt++;
    const rr=(1-red[side]*0.12)/(1-red[opp]*0.12);
    if(R()<0.55*Math.pow(t.mid/d.mid,1.0)*rr){st.ft++;
      if(R()<0.55*Math.pow(t.att/d.def,1.1)*rr){st.box+=ri(1,3);
        if(R()<0.5*t.phil.shots*Math.pow(t.att/d.def,0.8))shot(side,false);else if(R()<0.3)st.co++;}
      else if(R()<0.15*t.phil.shots)shot(side,true);}
    if(R()<0.13*d.phil.foul){s[opp].fo++;
      if(R()<0.13*(1.3-d.disc/150)){const c=onP[opp].filter(x=>x.pos!=="POR");if(c.length){const x=wpick(c,x=>({DEF:3,LAT:2,MED:2.5,EXT:1,DEL:1}[x.pos]));const id=x.p.id;
        if(yel[id]||R()<0.05){s[opp].rc++;red[opp]++;cardsP[id]="r";ev.push({m,t:"r",s:opp,p:id});onP[opp]=onP[opp].filter(y=>y.p.id!==id);}
        else{yel[id]=1;s[opp].yc++;cardsP[id]="y";ev.push({m,t:"y",s:opp,p:id});}}}}
    for(let sd=0;sd<2;sd++)if(R()<0.0016*(1.25-0.1*medU[sd])){const c=onP[sd];if(c.length){const x=pick(c);if(!ev.some(e=>e.t==="i"&&e.p===x.p.id))ev.push({m,t:"i",s:sd,p:x.p.id});}}
    if(tl)tl.push([m,Math.round(100*s[0].pt/(s[0].pt+s[1].pt)),s[0].ft,s[1].ft,s[0].box,s[1].box,s[0].sh,s[1].sh,+s[0].xg.toFixed(2),+s[1].xg.toFixed(2),s[0].g,s[1].g,s[0].sot,s[1].sot]);

  return{h:hId,a:aId,hg:s[0].g,ag:s[1].g,s,ev,tl,rt,xi:[H.xi.map(x=>[x.p.id,x.pos]),A.xi.map(x=>[x.p.id,x.pos])],comp:o.comp||"",pen,wk:G.week,se:G.season};}
function applyMatch(r){

function table(lg){const rows={};lg.cl.forEach(id=>rows[id]={id,pj:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});

function askingPrice(p){if(p.club<0)return 0;const c=G.clubs[p.club];const r=squadRank(c,p);let a=p.val*(r<=3?1.6:r<=11?1.3:1.0);if(p.listed)a*=0.85;if(p.exp<=G.season)a*=0.65;return niceRound(Math.min(a,p.clause||a));}

  const cur=p.club>=0?G.clubs[p.club].rep:c.rep-10;let i=58+(c.rep-cur)*1.3;const rank=squadRank(c,p);i+=rank<=11?12:rank<=16?0:-15;if(p.mor<40)i+=12;if(p.club<0)i+=15;

  for(const id of c.pl){const p=G.P[id];if(!p||G.offIn.some(o=>o.pid===id))continue;const prob=p.listed?0.45:(p.ovr>=clubAvg(c)+3?0.06:0.015);
    if(R()<prob){const cs=aiClubsFor(p);if(!cs.length)continue;const b=pick(cs);const fee=niceRound(p.val*(p.listed?rf(.7,1.05):rf(1.0,1.4)));
      G.offIn.push({id:G.nid++,pid:id,c:b.id,fee,max:niceRound(fee*rf(1.05,1.3)),exp:G.week+2});
      addInbox("Oferta recibida",`${b.name} ofrece ${fmt(fee)} por ${p.n}. Revísala en Mercado › Ofertas.`,"offer");}}
  G.offIn=G.offIn.filter(o=>o.exp>=G.week&&G.P[o.pid]&&G.P[o.pid].club===G.user);}
function refreshRequests(){G.req=G.req.filter(r=>r.exp>=G.week&&r.se===G.season);let n=0;
  while(G.req.length<12&&n++<60){const c=pick(G.clubs);if(c.user||G.req.some(r=>r.c===c.id))continue;const pos=posNeed(c);const a=Math.round(clubAvg(c));
    const age=pick([23,26,29,32,34]);const min=Math.round(a-3+gauss()*2);
    G.req.push({id:G.nid++,c:c.id,pos,min,age,fee:niceRound(rawValue(min+3)*rf(0.8,1.5)),exp:G.week+ri(3,6),se:G.season});}}
function offerToRequest(rid,pid,fee){const r=G.req.find(x=>x.id===rid),p=G.P[pid];if(!r||!p)return{ok:false,msg:"Petición no disponible."};
  if(!windowOpen())return{ok:false,msg:"El mercado está cerrado; las peticiones se resuelven con el mercado abierto."};
  if(p.pos!==r.pos)return{ok:false,msg:"La posición no encaja con lo que buscan."};
  if(p.age>r.age)return{ok:false,msg:`Buscan jugadores de ${r.age} años o menos.`};
  if(p.ovr<r.min)return{ok:false,msg:`${G.clubs[r.c].name} no lo ve suficiente nivel (piden media ${r.min}+).`};
  const lim=r.fee*(p.ovr>=r.min+5?1.15:1);if(fee>lim)return{ok:false,msg:`Les parece caro. Su tope ronda ${fmt(r.fee)}.`};
  const dest=G.clubs[r.c];if(p.ovr>clubAvg(uc())+2&&dest.rep<uc().rep-20&&p.mor>45&&R()<0.5)return{ok:false,msg:`${p.n} no quiere bajar de categoría a ${dest.name}.`};
  sellPlayer(pid,r.c,fee);G.req=G.req.filter(x=>x.id!==rid);return{ok:true,msg:`¡Trato hecho! ${p.n} se va a ${dest.name} por ${fmt(fee)}.`};}
function aiTransfers(){if(!windowOpen())return;const all=Object.values(G.P);let done=0;
  for(let k=0;k<40&&done<10;k++){const b=pick(G.clubs);if(b.user||b.pl.length>=27)continue;const pos=posNeed(b);const a=clubAvg(b);
    for(let t=0;t<250;t++){const p=pick(all);if(p.pos!==pos||p.club===G.user||p.club===b.id)continue;if(Math.abs(p.ovr-(a+1))>4)continue;
      if(p.club>=0){const s=G.clubs[p.club];if(s.rep>b.rep+4||s.pl.length<=19||posCount(s,pos)<=SQUAD_T[pos]-1)continue;
        const fee=niceRound(p.val*rf(.9,1.3));moveSquad(p,b.id);p.exp=G.season+ri(2,4);
        if(fee>15e6&&R()<0.6)pushNews(`${b.name.toUpperCase()} CIERRA A ${p.n.toUpperCase()}`,`Traspaso de ${fmt(fee)} desde ${s.name}`,"transfer");}
      else{moveSquad(p,b.id);p.exp=G.season+ri(1,3);}
      p.wage=niceRound(baseWage(p)*rf(.9,1.2));p.val=calcValue(p);done++;break;}}}

function hireCoach(cid,yrs){const co=G.C[cid],c=uc();if(co.rep>c.rep+18)return`${co.n} considera que el proyecto no está a su altura.`;

function fireCoach(){const c=uc(),co=G.C[c.coach];if(!co)return 0;const wl=Math.max(0,co.exp-G.season)*SEASON_WEEKS+(SEASON_WEEKS-G.week);const cost=niceRound(co.wage*wl*0.5);
  G.fin.bal-=cost;co.club=-1;co.happy=50;co.rep=Math.max(10,co.rep-4);c.coach=null;G.board.conf=clamp(G.board.conf-2,0,100);

function setPhil(k){const c=uc();if(c.phil===k)return;c.phil=k;c.adapt=0.5;const co=G.C[c.coach];if(co){co.happy=clamp(co.happy+(co.style===k?12:-10),0,100);}}

function applyEffects(e){const c=uc(),co=G.C[c.coach];let txt=[];
  if(e.coach&&co){co.happy=clamp(co.happy+e.coach,0,100);txt.push(`Entrenador ${e.coach>0?"+":""}${e.coach}`);}

  if(e.mor){c.pl.forEach(id=>{const p=G.P[id];if(p)p.mor=clamp(p.mor+e.mor,0,100);});txt.push(`Vestuario ${e.mor>0?"+":""}${e.mor}`);}
  return txt.join(" · ");}
function checkUnhappy(){const c=uc();const r=G.week-LEAGUE_START;if(r<4)return;
  for(const id of c.pl){const p=G.P[id];if(!p||p.inj>0)continue;const role=roleOf(p);const share=p.st.mn/Math.max(1,r*90);
    const k="unh"+id;if((G.cool[k]||0)>G.week)continue;
    if((role==="Estrella"||role==="Titular")&&share<0.45&&p.mor<55||(role==="Rotación"&&share<0.2&&p.mor<45)){
      G.cool[k]=G.week+7;
      addInbox("Jugador descontento",`${p.n} (${role}) se queja de su falta de minutos (${Math.round(share*100)}% jugado) y pide una reunión.`,"social",[
        {l:"Prometerle minutos",a:"unhappy",v:{pid:id,c:"promise"}},{l:"Pedirle paciencia",a:"unhappy",v:{pid:id,c:"talk"}},{l:"Ponerlo en venta",a:"unhappy",v:{pid:id,c:"list"}},{l:"Ignorar",a:"unhappy",v:{pid:id,c:"ignore"}}]);
      return;}}}
function checkRaise(){const c=uc();const r=G.week-LEAGUE_START;if(r<8)return;
  for(const id of c.pl){const p=G.P[id];if(!p||p.st.ap<6)continue;const avgR=p.st.rt/p.st.ap;const k="rai"+id;if((G.cool[k]||0)>G.week)continue;
    if(avgR>7.1&&p.wage<baseWage(p)*0.9){G.cool[k]=G.week+12;const nw=niceRound(p.wage*1.25);
      addInbox("Petición de mejora",`${p.n} está rindiendo a gran nivel (media ${avgR.toFixed(2)}) y su agente pide subir su sueldo de ${fmt(p.wage)} a ${fmt(nw)} semanales.`,"social",[
        {l:`Aceptar (${fmt(nw)}/sem)`,a:"raise",v:{pid:id,c:"yes",w:nw}},{l:"Abrir renovación",a:"raise",v:{pid:id,c:"neg"}},{l:"Rechazar",a:"raise",v:{pid:id,c:"no"}}]);return;}}}

  if(t==="raise")addInbox("Reunión con el staff",`${co.n} pide una mejora salarial del 20% (de ${fmt(co.wage)} a ${fmt(co.wage*1.2)}/sem). Dice sentirse infravalorado.`,"staff",[

    {l:isChair()?`Aprobar obra (${fmt(INFRA[k].max>c.infra[k]?buildCost(k):0)})`:"Trasladar al presidente",a:"staff",v:{c:"facY",k}},{l:"Ahora no",a:"staff",v:{c:"facN"}}]);}
  else addInbox("Reunión con el staff",`${co.n} pregunta si puede adaptar el estilo a su idea: ${PHIL[co.style].n}. La filosofía actual es ${PHIL[c.phil].n}.`,"staff",[
    {l:"Adoptar su estilo",a:"staff",v:{c:"philY"}},{l:"Mantener la filosofía del club",a:"staff",v:{c:"philN"}}]);}
const ACT={
  press(v){return applyEffects(v.e);},
  unhappy(v){const p=G.P[v.pid];if(!p||p.club!==G.user)return"El jugador ya no está en el club.";const co=G.C[uc().coach];
    if(v.c==="promise"){p.prom=6;p.mor=clamp(p.mor+20,0,100);if(co)co.happy=clamp(co.happy-5,0,100);return`${p.n} se queda tranquilo. El entrenador acepta a regañadientes darle minutos.`;}
    if(v.c==="talk"){if(R()<0.55){p.mor=clamp(p.mor+10,0,100);return`${p.n} entiende la situación.`;}p.mor=clamp(p.mor-8,0,100);return`${p.n} sale molesto de la reunión.`;}
    if(v.c==="list"){p.listed=true;p.mor=clamp(p.mor-5,0,100);return`${p.n} queda en la lista de transferibles.`;}
    p.mor=clamp(p.mor-12,0,100);applyEffects({mor:-2});return"El vestuario toma nota de tu silencio.";},
  raise(v){const p=G.P[v.pid];if(!p||p.club!==G.user)return"El jugador ya no está en el club.";
    if(v.c==="yes"){if(wageBill(uc())-p.wage+v.w>G.fin.wbud)return"No cabe en el límite salarial. Ajusta el presupuesto o negocia la renovación.";p.wage=v.w;p.mor=clamp(p.mor+15,0,100);return`${p.n} cobra ahora ${fmt(v.w)}/sem.`;}
    if(v.c==="neg"){openNeg(p.id,0,true);return"__neg";}
    p.mor=clamp(p.mor-15,0,100);return`${p.n} se siente infravalorado.`;},
  staff(v){const c=uc(),co=G.C[c.coach];if(!co)return"Ya no hay entrenador.";
    if(v.c==="raiseY"){co.wage=niceRound(co.wage*1.2);co.happy=clamp(co.happy+15,0,100);return`${co.n} cobra ahora ${fmt(co.wage)}/sem.`;}
    if(v.c==="raiseN"){co.happy=clamp(co.happy-15,0,100);return`${co.n} no oculta su malestar.`;}
    if(v.c==="signY"){co.happy=clamp(co.happy+6,0,100);G.cool.coachPos={pos:v.pos,until:G.season*100+G.week+16};return"El míster agradece el compromiso.";}
    if(v.c==="signN"){co.happy=clamp(co.happy-6,0,100);return"El míster acepta, sin entusiasmo.";}
    if(v.c==="facY"){if(isChair()){const e=startBuild(v.k);if(e)return e;co.happy=clamp(co.happy+10,0,100);return"Obra aprobada.";}return requestFacility(v.k);}
    if(v.c==="facN"){co.happy=clamp(co.happy-4,0,100);return"Petición aparcada.";}
    if(v.c==="philY"){c.phil=co.style;c.adapt=0.7;co.happy=clamp(co.happy+15,0,100);return`El club adopta ${PHIL[co.style].n}.`;}
    co.happy=clamp(co.happy-8,0,100);return"Se mantiene la filosofía del club.";},
  sponsor(v){const o=v.o;G.fin.sp[v.slot]={name:o.name,amt:o.amt,yrs:o.yrs,bonus:o.bonus};return`Contrato firmado con ${o.name}: ${fmt(o.amt)}/temporada durante ${o.yrs} años.`;},
  job(v){acceptJob(v.cid);return"__reload";}
};
function doAction(itemId,idx){const it=G.inbox.find(x=>x.id===itemId);if(!it||it.done)return"";const a=it.actions[idx];const r=ACT[a.a](a.v);if(r!=="__neg"&&r!=="__reload"){it.done=true;it.res=r;}else it.done=true;return r;}
function requestFacility(k){const key="fac";if((G.cool[key]||0)>G.week+G.season*100)return"Ya has hecho una petición recientemente.";G.cool[key]=G.season*100+G.week+6;
  const cost=buildCost(k);if(G.fin.bal>cost*1.6&&G.board.conf>40){const e=startBuild(k,true);return e||`El presidente aprueba la obra de ${INFRA[k].n.toLowerCase()}.`;}
  return"El presidente rechaza la inversión por ahora.";}
function requestBudget(){const key="bud";if((G.cool[key]||0)>G.week+G.season*100)return"La junta ya te atendió hace poco. Espera unas semanas.";G.cool[key]=G.season*100+G.week+8;
  if(G.fin.bal>G.fin.tb*1.8&&G.board.conf>50){const add=niceRound(Math.max(5e5,G.fin.tb*rf(.2,.4)));G.fin.tb+=add;G.fin.wbud=niceRound(G.fin.wbud*1.05);return`La junta amplía el presupuesto de fichajes en ${fmt(add)} y el límite salarial un 5%.`;}
  G.board.conf=clamp(G.board.conf-1,0,100);return"La junta rechaza ampliar el presupuesto.";}

// ---------- objetivo y confianza ----------
function setObjective(){const lg=leagueOf(G.user);const rank=lg.cl.slice().sort((a,b)=>G.clubs[b].rep-G.clubs[a].rep).indexOf(G.user)+1;
  let o,t;if(lg.div===1){if(rank<=2){o="Ganar la liga";t=1;}else if(rank<=5){o="Clasificar entre los 4 primeros";t=4;}else if(rank<=10){o="Terminar en la mitad alta";t=8;}else{o="Evitar el descenso";t=14;}}
  else{if(rank<=4){o="Lograr el ascenso (top 2)";t=2;}else if(rank<=10){o="Terminar en la mitad alta";t=8;}else{o="Consolidar el proyecto (top 12)";t=12;}}
  G.board.obj=o;G.board.target=t;}
function boardWeekly(res){const r=G.week-LEAGUE_START;let d=0;if(res!=null)d+=res>0?0.9:res<0?-1.0:0.1;
  if(r>=3){const pos=posInLeague(G.user);d+=clamp((G.board.target-pos)*0.12,-1.2,0.8);}
  if(G.fin.bal<0)d-=0.6;if(G.fin.bal<-debtLimit()*0.5)d-=1;G.board.conf=clamp(G.board.conf+d,0,100);
  const co=G.C[uc().coach];if(co&&res!=null)co.happy=clamp(co.happy+(res>0?1:res<0?-1:0),0,100);}

// ---------- semana ----------
function weeklyUpdate(out,homeGame,userRes){
  const w=G.week;
  for(const id in G.P){const p=G.P[id];if(p.inj>0)p.inj--;const gym=p.club===G.user?uc().infra.gym:2;p.fit=clamp(p.fit+13+gym*2,0,100);if(p.prom>0)p.prom--;if(p.club<0)p.mor=clamp(p.mor+0.5,0,100);}
  const c=uc();if(c.adapt<1)c.adapt=Math.min(1,c.adapt+0.1);
  if(w%4===0)develop();
  weeklyFinance(homeGame);progressBuilds();progressMissions();
  aiTransfers();if(w%2===0)refreshRequests();genIncomingOffers();
  boardWeekly(userRes);
  const r=w-LEAGUE_START;
  if(r>=1&&r<ROUNDS){if(R()<0.2)genPress();checkUnhappy();checkRaise();if(R()<0.11)genStaffMeeting();}
  // promesas de minutos incumplidas
  c.pl.forEach(id=>{const p=G.P[id];if(p&&p.prom===1&&p.st.mn<(r*90)*0.4){p.mor=clamp(p.mor-25,0,100);addInbox("Promesa incumplida",`${p.n} se siente engañado: le prometiste minutos y no han llegado.`,"social");}});
  // entrenador propio
  const co=G.C[c.coach];
  if(co&&co.happy<15&&R()<0.5){co.club=-1;c.coach=null;addInbox("Dimisión del entrenador",`${co.n} presenta su dimisión por diferencias con la dirección. Contrata un sustituto cuanto antes.`,"staff");pushNews(`${co.n.toUpperCase()} DIMITE EN ${c.name.toUpperCase()}`,"Crisis en el banquillo","staff");}
  if(!c.coach&&w%3===0)addInbox("Sin entrenador","El equipo sigue dirigido por un interino. Ve a Plantilla › Staff para contratar un técnico.","staff");
  // destituciones IA
  if(r>=10&&r<ROUNDS&&R()<0.5){for(const lg of G.leagues){const tb=table(lg);const last=tb.slice(-3).map(x=>x.id);for(const id of last){const cl=G.clubs[id];if(cl.user||R()>0.08)continue;
    const old=G.C[cl.coach];if(old){old.club=-1;old.rep=Math.max(10,old.rep-5);}const fc=freeCoaches().filter(x=>x.rep<=cl.rep+12);const nc=fc[0]||newCoach(cl.rep,-1);nc.club=cl.id;cl.coach=nc.id;cl.phil=nc.style;nc.exp=G.season+1;
    if(lg.div===1&&R()<0.5)pushNews(`${cl.name.toUpperCase()} DESTITUYE A SU ENTRENADOR`,`${nc.n} toma el relevo en el banquillo`,"staff");}}}
  // decisiones sin respuesta
  for(const it of G.inbox){if(it.actions&&!it.done&&(it.se<G.season||it.wk<=w-3)){if(it.type==="sponsor"){const r=ACT.sponsor(it.actions[1].v);it.res="Elegido por defecto: "+r;}else it.res="Sin respuesta";it.done=true;}}
  // patrocinadores al inicio
  if(w===1)sponsorRound();
  // avisos de contrato
  if(w===24){const exp=c.pl.map(id=>G.P[id]).filter(p=>p&&p.exp<=G.season);if(exp.length)addInbox("Contratos que vencen",`${exp.length} jugadores terminan contrato esta temporada: ${exp.map(p=>p.n).join(", ")}. Renueva o se marcharán libres.`,"transfer");}
  if(w===SEASON_WEEKS-6)addInbox("Informe anual de cantera",`La academia (nivel ${c.infra.acad}) prepara su promoción anual. Al final de temporada subirán ${3+Math.floor(c.infra.acad/2)} juveniles.`,"club");
  // estado crítico
  if(isChair()&&G.fin.neg>=8&&G.fin.bal<-debtLimit()){gameOver("bank");}
  if(!isChair()&&G.board.conf<10&&r>=6){gameOver("fired");}
}
function sponsorRound(){for(const slot of["main","kit"]){const s=G.fin.sp[slot];if(s&&s.yrs>0)continue;const offers=genSponsorOffers(slot);
  if(isChair())addInbox(slot==="main"?"Ofertas de patrocinio principal":"Ofertas de marca deportiva","Elige el patrocinador para las próximas temporadas:","sponsor",offers.map(o=>({l:`${o.name} · ${fmt(o.amt)}/temp · ${o.yrs} años · bonus título ${fmt(o.bonus)}`,a:"sponsor",v:{slot,o}})));

function develop(){const c=uc();const r=Math.max(1,G.week-LEAGUE_START);
  for(const id in G.P){const p=G.P[id];const own=p.club===G.user;const club=G.clubs[p.club];
    const tr=own?c.infra.train:club?clamp(Math.round(club.rep/22),1,5):1;const co=club?G.C[club.coach]:null;
    let g;const a=p.age;if(a<=21)g=(p.pot-p.ovr)*0.075;else if(a<=24)g=(p.pot-p.ovr)*0.06;else if(a<=28)g=(p.pot-p.ovr)*0.04;else if(a<=30)g=0;else if(a<=32)g=-0.3;else g=-0.7;
    if(g>0){const share=clamp(p.st.mn/(r*90),0,1);g*=(0.7+0.12*tr)*(co?0.8+co.dev/250:0.85)*(0.6+0.8*share);if(p.club<0)g*=0.5;}
    g+=gauss()*0.35;if(Math.abs(g)<0.15)continue;
    const w=W[p.pos];for(let i=0;i<8;i++){if(w[i]>0||R()<0.3)p.a[i]=clamp(p.a[i]+Math.round(g+gauss()*0.5),5,99);}
    p.ovr=calcOvr(p.pos,p.a);if(p.ovr>p.pot)p.pot=p.ovr;p.val=calcValue(p);}}

function advanceWeek(){
  const out={um:[]};if(G.over)return out;
  const w=G.week;let homeGame=false,userRes=null;
  if(EURO_WEEKS[w]!==undefined&&G.euro)playEuro(EURO_WEEKS[w],out);
  const r=w-LEAGUE_START;
  if(r>=0&&r<ROUNDS){for(const lg of G.leagues){lg.res[r]=lg.fx[r].map(([h,a])=>{const rec=h===G.user||a===G.user;const m=simMatch(h,a,{rec,comp:lg.name+" · Jornada "+(r+1)});applyMatch(m);
      if(rec){out.um.push(m);homeGame=h===G.user;const my=h===G.user?m.hg:m.ag,th=h===G.user?m.ag:m.hg;userRes=my>th?1:my<th?-1:0;matchNews(m);}return[m.hg,m.ag];});}}
  weeklyUpdate(out,homeGame,userRes);
  G.week++;
  if(G.week>SEASON_WEEKS&&!G.over)out.season=endSeason();
  G.lastUM=out.um;save();return out;}
function matchNews(m){const c=uc();const home=m.h===G.user;const my=home?m.hg:m.ag,th=home?m.ag:m.hg;const opp=G.clubs[home?m.a:m.h];
  if(my-th>=3)pushNews(`¡EXHIBICIÓN DE ${c.name.toUpperCase()}!`,`${my}-${th} ante ${opp.name}`,"match");
  else if(th-my>=3)pushNews(`${c.name.toUpperCase()} HUNDIDO`,`Dura derrota ${my}-${th} ante ${opp.name}. La afición pide explicaciones`,"match");
  else if(/DDD$/.test(c.form||""))pushNews(`CRISIS EN ${c.name.toUpperCase()}`,"Tercera derrota seguida. El palco, en el punto de mira","match");
  else if(/VVVV$/.test(c.form||""))pushNews(`${c.name.toUpperCase()} NO CONOCE LA DERROTA`,"Racha de cuatro victorias seguidas","match");}

function endSeason(){
  const sum={season:G.season,lines:[]};const c=uc();const prevTables={};const finals={};
  for(const lg of G.leagues){const t=table(lg);finals[lg.id]=t;prevTables[lg.id]=t.map(r=>r.id);G.champs.push({se:G.season,lg:lg.name,cc:lg.cc,div:lg.div,c:t[0].id,name:G.clubs[t[0].id].name});}
  const ul=leagueOf(G.user);const pos=finals[ul.id].findIndex(r=>r.id===G.user)+1;const cc=country(c.cc);
  sum.pos=pos;sum.lg=ul.name;sum.div=ul.div;sum.obj=G.board.obj;sum.target=G.board.target;sum.met=pos<=G.board.target;
  // premios
  const prize=niceRound(ul.div===1?(17-pos)*450000*cc.tv+(pos===1?8e6*cc.tv:0):(17-pos)*80000);G.fin.bal+=prize;sum.prize=prize;
  if(pos===1){const b=(G.fin.sp.main&&G.fin.sp.main.bonus||0)+(G.fin.sp.kit&&G.fin.sp.kit.bonus||0);G.fin.bal+=b;sum.bonus=b;pushNews(`¡${c.name.toUpperCase()}, CAMPEÓN!`,`Título de ${ul.name} para el club`,"title");}
  // ascensos/descensos
  const moves=[];
  for(const cc2 of COUNTRIES){const d1=G.leagues.find(l=>l.cc===cc2.id&&l.div===1),d2=G.leagues.find(l=>l.cc===cc2.id&&l.div===2);
    const down=finals[d1.id].slice(-2).map(r=>r.id),up=finals[d2.id].slice(0,2).map(r=>r.id);
    d1.cl=d1.cl.filter(id=>!down.includes(id)).concat(up);d2.cl=d2.cl.filter(id=>!up.includes(id)).concat(down);
    up.forEach(id=>{G.clubs[id].div=1;G.clubs[id].rep=clamp(G.clubs[id].rep+6,1,99);});down.forEach(id=>{G.clubs[id].div=2;G.clubs[id].rep=clamp(G.clubs[id].rep-6,1,99);});
    if(up.includes(G.user)){moves.push("up");c.tvBase=niceRound(c.tvBase*3);}if(down.includes(G.user)){moves.push("down");c.tvBase=niceRound(c.tvBase*0.35);}}
  sum.moved=moves[0]||null;
  if(sum.moved==="up")pushNews(`¡${c.name.toUpperCase()} ASCIENDE!`,"Fiesta en la ciudad: el club sube de categoría","title");
  if(sum.moved==="down")pushNews(`${c.name.toUpperCase()} DESCIENDE`,"Golpe durísimo para el proyecto","title");
  // reputación por posición
  for(const lg of G.leagues){finals[lg.id]&&finals[lg.id].forEach((r,i)=>{const cl=G.clubs[r.id];const exp=lg.cl.length/2;cl.rep=clamp(Math.round(cl.rep+(exp-i)*0.25+(G.euro&&G.euro.ch===r.id?4:0)),5,99);});}
  // junta
  let dc=sum.met?12:-(pos-G.board.target)*3;if(sum.moved==="down")dc-=20;if(sum.moved==="up")dc+=15;G.board.conf=clamp(G.board.conf+dc,0,100);sum.conf=G.board.conf;
  G.hist.push({se:G.season,lg:ul.name,pos,euro:G.euro&&G.euro.ch===G.user?"Campeón":null,bal:G.fin.bal});
  // jugadores: edad, contratos, retiradas
  const leaving=[];
  for(const id in G.P){const p=G.P[id];p.age++;
    if(p.age>=34&&R()<(p.age-32)*0.25||p.age>=38){if(p.club===G.user)leaving.push(p.n+" (se retira)");moveSquad(p,-1);delete G.P[id];delete G.known[id];continue;}
    if(p.club>=0&&p.exp<=G.season){if(p.club===G.user){leaving.push(p.n+" (fin de contrato)");moveSquad(p,-1);p.exp=G.season+1;}
      else if(R()<0.72&&p.age<33){p.exp=G.season+ri(1,3);}else{moveSquad(p,-1);p.exp=G.season+1;}}
    p.st=newSt();p.prom=0;p.listed=p.club===G.user?p.listed:false;p.fit=100;p.mor=clamp(p.mor*0.5+35,0,100);p.val=calcValue(p);}
  sum.leaving=leaving;
  // agentes libres: limpiar viejos
  const fa=Object.values(G.P).filter(p=>p.club<0);if(fa.length>220)fa.sort((a,b)=>a.ovr-b.ovr).slice(0,fa.length-220).forEach(p=>{delete G.P[p.id];delete G.known[p.id];});
  // cantera
  const intake=[];
  for(const cl of G.clubs){const lvl=cl.user?cl.infra.acad:clamp(Math.round(cl.rep/22),1,5);const n=cl.user?3+Math.floor(lvl/2):ri(2,3);const base=teamAvgFor(cl.rep);
    for(let i=0;i<n;i++){const pos=i===0&&posCount(cl,"POR")<3?"POR":pick(POS);const ovr=clamp(Math.round(base-14+lvl*1.5+gauss()*4),30,80);
      const potB=base-2+lvl*3.2+gauss()*6+(R()<0.04+lvl*0.012?12:0);const p=newPlayer({pos,ovr,age:ri(16,18),nat:pickNat(cl.cc),club:cl.id,pot:clamp(Math.round(Math.max(ovr+4,potB)),ovr+2,96),yth:true});
      p.wage=niceRound(Math.max(400,p.wage*0.5));p.exp=G.season+3;cl.pl.push(p.id);if(cl.user){G.known[p.id]=2;intake.push(p);}}}
  sum.intake=intake.map(p=>p.id);
  // completar plantillas IA
  for(const cl of G.clubs){if(cl.user)continue;
    for(const pos of POS){while(posCount(cl,pos)<SQUAD_T[pos]-1){const free=Object.values(G.P).find(p=>p.club<0&&p.pos===pos&&Math.abs(p.ovr-clubAvg(cl))<6);
      if(free){moveSquad(free,cl.id);free.exp=G.season+ri(1,3);}else{const p=newPlayer({pos,ovr:Math.round(clubAvg(cl)-2+gauss()*3),age:ri(20,29),nat:pickNat(cl.cc),club:cl.id});cl.pl.push(p.id);p.exp=G.season+ri(1,3);}}}
    while(cl.pl.length>28){const worst=cl.pl.map(id=>G.P[id]).sort((a,b)=>a.ovr-b.ovr)[0];moveSquad(worst,-1);}}
  // entrenadores
  for(const id in G.C){const co=G.C[id];if(co.club>=0&&co.exp<=G.season){const cl=G.clubs[co.club];if(cl.user){addInbox("Contrato del entrenador",`El contrato de ${co.n} se ha renovado automáticamente una temporada.`,"staff");co.exp=G.season+1;}
      else if(R()<0.75)co.exp=G.season+ri(1,2);else{co.club=-1;const nc=freeCoaches().filter(x=>x.rep<=cl.rep+10)[0]||newCoach(cl.rep,-1);nc.club=cl.id;nc.exp=G.season+2;cl.coach=nc.id;cl.phil=nc.style;}}}
  while(freeCoaches().length<14)newCoach(ri(25,85),-1);
  // contratos de patrocinio
  for(const k of["main","kit"]){const s=G.fin.sp[k];if(s){s.yrs--;if(s.yrs<=0)G.fin.sp[k]=null;}}
  // nueva temporada
  G.season++;G.week=1;G.cool={};G.offIn=[];G.req=[];
  for(const lg of G.leagues){lg.fx=roundRobin(lg.cl);lg.res=[];}
  setupEuro(prevTables);setObjective();refreshRequests();refreshScoutPool();
  G.fin.season={inc:0,exp:0};
  if(!isChair()){G.fin.tb=niceRound(Math.max(G.fin.tb*0.3,G.fin.bal*0.45));G.fin.wbud=niceRound(Math.max(wageBill(c)*1.06,G.fin.wbud));}
  G.fin.refT=Math.round(cc.tk*(c.div===1?1:0.55)*(0.7+c.rep/160));
  if(G.euro.teams.includes(G.user))addInbox("Europa",`¡Clasificados para la ${EURO_NAME}! Rival en octavos: ${G.clubs[G.euro.rounds[0].find(t=>t[0]===G.user||t[1]===G.user).find(x=>x!==G.user&&typeof x==="number")].name}.`,"euro");
  addInbox(`Balance de la temporada ${sum.season}/${String(sum.season+1).slice(2)}`,`Posición final: <b>${pos}º</b> en ${ul.name}. Objetivo (${sum.obj}): ${sum.met?"<b>cumplido</b>":"<b>no cumplido</b>"}. Premio por clasificación: ${fmt(prize)}.${leaving.length?" Salidas: "+leaving.join(", ")+".":""}`,"board");
  if(intake.length)addInbox("Llegan los juveniles",`Suben ${intake.length} canteranos de la academia:`,"club",null,{players:intake.map(p=>p.id)});
  addInbox("Objetivo de la junta",`Nueva temporada. La junta espera: <b>${G.board.obj}</b>.`,"board");
  if(!isChair()&&G.board.conf<15)gameOver("fired");
  return sum;}

  if(r>=0&&r<ROUNDS){const m=lg.fx[r].find(([h,a])=>h===G.user||a===G.user);if(m)res.push({h:m[0],a:m[1],comp:lg.name+" · Jornada "+(r+1)});}
  return res;}

function spark(a){if(!a||a.length<2)return"";const mn=Math.min(...a,0),mx=Math.max(...a,1);const pts=a.map((v,i)=>`${(i/(a.length-1)*300).toFixed(1)},${(75-(v-mn)/(mx-mn)*70).toFixed(1)}`).join(" ");const z=75-(0-mn)/(mx-mn)*70;
  return`<svg class="spark" viewBox="0 0 300 80" preserveAspectRatio="none"><line x1="0" x2="300" y1="${z}" y2="${z}" stroke="#ffffff22" stroke-dasharray="4"/><polyline points="${pts}" fill="none" stroke="#2f80ff" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;}

  <div class="row" style="position:sticky;bottom:0;padding:10px 0;background:var(--bg)"><button class="btn" id="lsp">Velocidad x1</button><button class="btn p sp" id="lsk">Ir al final ▶▶</button></div></div>`;
  document.body.appendChild(d);let i=0,spd=1,tm=null;const speeds=[1,2,4];
  const nm=id=>G.P[id]?G.P[id].n:"—";
  const tick=()=>{if(i>=m.tl.length){fin();return;}const t=m.tl[i];$("#lsc").textContent=t[10]+" - "+t[11];$("#lclk").textContent=t[0]+"'";
    for(const e of m.ev.filter(e=>e.m===t[0])){const side=e.s===0?H:A;let txt="";
      if(e.t==="g")txt=`⚽ <b>¡GOOOL de ${esc(side.short)}!</b> ${esc(nm(e.p))}${e.a?` (asist. ${esc(nm(e.a))})`:""} <span class="mu">· xG ${e.xg}</span>`;
      else if(e.t==="c")txt=`😱 Ocasión clarísima de ${esc(nm(e.p))} (${esc(side.short)}) <span class="mu">· xG ${e.xg}</span>`;
      else if(e.t==="y")txt=`🟨 Amarilla para ${esc(nm(e.p))} (${esc(side.short)})`;else if(e.t==="r")txt=`🟥 <b>¡Expulsado ${esc(nm(e.p))}!</b> (${esc(side.short)})`;else if(e.t==="i")txt=`🚑 ${esc(nm(e.p))} (${esc(side.short)}) se retira lesionado`;
      $("#lfeed").insertAdjacentHTML("afterbegin",`<div class="e"><span class="m">${e.m}'</span><span>${txt}</span></div>`);}

    $("#lst").innerHTML=liveStats(t);i++;};
  const run=()=>{clearInterval(tm);tm=setInterval(tick,140/spd);};
  const fin=()=>{clearInterval(tm);while(i<m.tl.length)tick();clearInterval(tm);$("#lclk").textContent="Final";$("#lfeed").insertAdjacentHTML("afterbegin",`<div class="e"><span class="m">FT</span><b>Final del partido${m.pen!=null?` · pasa ${esc(G.clubs[m.pen===0?m.h:m.a].name)} en los penaltis`:""}</b></div>`);

  $("#lsp").onclick=()=>{spd=speeds[(speeds.indexOf(spd)+1)%3];$("#lsp").textContent="Velocidad x"+spd;run();};

    <p><b>Continuar</b> avanza una semana. Si tu equipo juega, verás el partido en directo con xG, entradas al último tercio y toques en el área, y después el análisis en tarjetas.</p>
    <p><b>Plantilla</b>: el entrenador elige el once; tú decides quién lo entrena y con qué filosofía. Gestiona la moral: los jugadores que no juegan se quejan.</p>
    <p><b>Mercado</b>: busca, envía ojeadores con misiones concretas, ofrece descartes a las <b>peticiones de clubes</b> y negocia sueldo, años, cláusula, bonus y subidas.</p>
    <p><b>Club Zone</b>: amplía el estadio, palcos VIP, tiendas, restauración y ocio (ingresos), y centro médico, gimnasio, academia y ciudad deportiva (rendimiento).</p>
    <p><b>Presidente</b>: bancos, presupuestos, precio de la entrada y patrocinadores. <b>Director deportivo</b>: depende de la junta.</p>
    <p>Mercado abierto en las semanas 1-4 y 17-20. La partida se guarda sola en este navegador cada semana.</p></div><button class="btn w" data-a="close">Entendido</button>`);},
  newgame(){confirmBox("Se borrará la partida actual.",()=>{wipe();G=null;UI.setup=null;UI.tab="home";UI.lgId=null;render();});},
  adv(){if(G.over){toast("La partida ha terminado: revisa la bandeja");return;}const pend=G.inbox.filter(i=>i.type==="sponsor"&&!i.done);if(pend.length){toast("Elige patrocinador en la bandeja antes de continuar");showMsg(pend[0].id);return;}
    const out=advanceWeek();render();playQueue(out.um.slice(),()=>{render();if(out.season)seasonSheet(out.season);else{const nd=G.inbox.find(i=>!i.read&&i.actions&&!i.done&&i.wk===G.week-1);if(nd)showMsg(nd.id);}});},
  post(){const m=G.lastUM[G.lastUM.length-1];if(m)postMatch(m,()=>{});},
  msg(e){showMsg(+e.dataset.id);render();},
  act(e){const r=doAction(+e.dataset.id,+e.dataset.k);save();if(r==="__neg"){render();negSheet();return;}if(r==="__reload"){closeSheet();UI.lgId=null;render();toast("¡Nuevo reto!");return;}closeSheet();render();if(r)toast(r);},
  pl(e){showPlayer(+e.dataset.id);},
  club(e){showClub(+e.dataset.id);},
  phil(e){setPhil(e.dataset.k);save();render();toast("Filosofía actualizada: "+PHIL[e.dataset.k].n);},
  fireco(){confirmBox("Pagarás una indemnización del 50% de lo que le queda de contrato.",()=>{const c=fireCoach();save();render();toast("Entrenador destituido ("+fmt(c)+")");});},
  hireco(e){const r=hireCoach(+e.dataset.id,2);save();render();toast(r||"¡Nuevo entrenador contratado!");},
  renew(e){const p=G.P[+e.dataset.id];const n=openNeg(p.id,0,true);if(n.it<18){G.neg=null;toast(p.n+" no quiere renovar ahora mismo");return;}negSheet();},
  list(e){const p=G.P[+e.dataset.id];p.listed=!p.listed;if(p.listed)p.mor=clamp(p.mor-5,0,100);save();showPlayer(p.id);render();},
  release(e){const p=G.P[+e.dataset.id];confirmBox(`Rescindir a ${esc(p.n)} costará la mitad de lo que le queda de contrato.`,()=>{const c=releasePlayer(p.id);save();render();toast("Contrato rescindido ("+fmt(c)+")");});},
  short(e){const id=+e.dataset.id;G.short=G.short||[];const i=G.short.indexOf(id);if(i>=0)G.short.splice(i,1);else G.short.push(id);save();showPlayer(id);},
  bid(e){bidSheet(+e.dataset.id);},
  dobid(e){const id=+e.dataset.id;const fee=Math.round(num("bfee")*1e6);const r=makeBid(id,fee);
    if(r.st==="ok"){openNeg(id,fee,false);negSheet();toast(r.msg);}
    else if(r.st==="counter")$("#bres").innerHTML=`<div class="card" style="background:var(--c2)">${esc(r.msg)}<button class="btn g w" style="margin-top:8px" data-a="accctr" data-id="${id}" data-f="${r.counter}">Aceptar ${fmt(r.counter)}</button></div>`;
    else $("#bres").innerHTML=`<div class="rd sm">${esc(r.msg)}</div>`;},
  accctr(e){const id=+e.dataset.id,f=+e.dataset.f;if(f>G.fin.tb){toast("Supera tu presupuesto de fichajes");return;}openNeg(id,f,false);negSheet();},
  payclause(e){const p=G.P[+e.dataset.id];if(!windowOpen()){toast("Mercado cerrado");return;}if(p.clause>G.fin.tb){toast("La cláusula supera tu presupuesto ("+fmt(G.fin.tb)+")");return;}openNeg(p.id,p.clause,false);negSheet();},
  negfree(e){const n=openNeg(+e.dataset.id,0,false);negSheet();},
  negsub(){const r=submitOffer(negOffer());if(r.st==="ok"){G.neg=null;save();closeSheet();render();toast(r.msg);}else if(r.st==="fail"){G.neg=null;save();closeSheet();render();toast(r.msg);}
    else{$("#nres").innerHTML=`<div class="${r.st==="err"?"rd":"ye"} sm">${esc(r.msg)}</div>`;}},
  negx(){G.neg=null;closeSheet();render();},
  stp(e){const inp=$("#"+e.dataset.t);const st=parseFloat(e.dataset.d);let v=(parseFloat(inp.value)||0)+st;v=clamp(v,parseFloat(inp.min),parseFloat(inp.max));inp.value=Math.round(v*100)/100;inp.dispatchEvent(new Event("input",{bubbles:true}));},
  search(){UI.f={pos:$("#fpos").value,age:+$("#fage").value,val:+$("#fval").value,cc:$("#fcc").value,exp:$("#fexp").checked,known:$("#fkn").checked,q:$("#fq").value};render();},
  mission(e){missionSheet(+e.dataset.id);},
  startm(e){startMission(+e.dataset.id,{cc:$("#mcc").value,pos:$("#mpos").value,age:+$("#mage").value,val:+$("#mval").value,exp:$("#mexp").checked,wk:+$("#mwk").value});save();closeSheet();render();toast("Ojeador en camino");},
  hiresc(e){const s=G.scoutPool.find(x=>x.id===+e.dataset.id);if(!s||G.scouts.length>=5)return;G.scouts.push(s);G.scoutPool=G.scoutPool.filter(x=>x!==s);G.scoutPool.push(newScout());save();render();toast(s.n+" se une a la red");},
  firesc(e){const id=+e.dataset.id;confirmBox("El ojeador dejará el club.",()=>{G.scouts=G.scouts.filter(x=>x.id!==id);save();render();});},
  reqoff(e){reqSheet(+e.dataset.id);},
  reqsend(e){const sel=document.querySelector('input[name="rp"]:checked');if(!sel){toast("Elige un jugador");return;}const r=offerToRequest(+e.dataset.id,+sel.value,Math.round(num("rfee")*1e6));
    if(r.ok){save();closeSheet();render();toast(r.msg);}else $("#rres").innerHTML=`<div class="rd sm">${esc(r.msg)}</div>`;},
  offacc(e){toast(respondOffer(+e.dataset.id,"accept"));save();render();},
  offrej(e){toast(respondOffer(+e.dataset.id,"reject"));save();render();},
  offctr(e){const o=G.offIn.find(x=>x.id===+e.dataset.id);sheet(`<h2>Contraoferta</h2><p class="sm mu">${esc(G.clubs[o.c].name)} ofrece ${fmt(o.fee)} por ${esc(G.P[o.pid].n)}.</p><div class="fld"><label>Tu precio (M€)</label>${stepper("ctr",(o.fee*1.2/1e6).toFixed(1),0.1,0,999)}</div><button class="btn p w" data-a="ctrgo" data-id="${o.id}">Enviar</button>`);},
  ctrgo(e){const r=respondOffer(+e.dataset.id,"counter",Math.round(num("ctr")*1e6));save();closeSheet();render();toast(r);},
  build(e){const k=e.dataset.k;if(isChair()){confirmBox(`Invertir ${fmt(buildCost(k))} en ${k==="stadium"?"ampliar el estadio":INFRA[k].n.toLowerCase()}?`,()=>{const r=startBuild(k);save();render();toast(r||"Obras en marcha");});}else{const r=requestFacility(k);save();render();toast(r);}},
  budget(){const f=G.fin;f.tb=clamp(Math.round(num("btb")*1e6),0,Math.max(0,f.bal));f.wbud=Math.round(num("bwb")*1000);f.ticket=clamp(Math.round(num("btk")),5,300);save();render();toast("Presupuestos aprobados");},
  reqbud(){const r=requestBudget();save();render();toast(r);},
  loan(e){const i=+e.dataset.i;const o=loanOffers()[i];const r=takeLoan(o,Math.round(num("ln"+i)*1e6));save();render();toast(r||"Préstamo firmado");},
  rnd(e){UI.round=clamp(UI.round+(+e.dataset.d),0,ROUNDS-1);render();},
  cont(){if(load()){if(!G.short)G.short=[];render();}else toast("No se pudo cargar");},
  ng1(){newWorld();UI.setup={step:1,role:null};render();},
  ng0(){UI.setup=null;G=null;render();},
  ng1b(){UI.setup.step=1;render();},
  role(e){UI.setup.role=e.dataset.k;render();},
  ng2(){UI.setup.step=2;render();scrollTo(0,0);},
  ngcc(e){UI.setup.cc=e.dataset.k;render();},
  pickclub(e){const id=+e.dataset.id;const c=G.clubs[id];sheet(`<div class="row">${crest(c,64)}<div class="sp"><h2>${esc(c.name)}</h2><div class="sm mu">${esc(leagueOf(id).name)} · ${stars(c.rep)}</div></div></div>
    <div class="grid2" style="margin:10px 0"><div class="kpi"><div class="l">Media plantilla</div><div class="v">${clubAvg(c).toFixed(1)}</div></div><div class="kpi"><div class="l">Estadio</div><div class="v">${c.cap.toLocaleString("es")}</div></div><div class="kpi"><div class="l">Saldo aprox.</div><div class="v">${fmt(niceRound(Math.max(1.5e6,c.rep*c.rep*4200)))}</div></div><div class="kpi"><div class="l">Masa salarial</div><div class="v">${fmt(wageBill(c))}/sem</div></div></div>
    <button class="big" data-a="startc" data-id="${id}">DIRIGIR ESTE CLUB</button>`);},
  startc(e){closeSheet();startGame(UI.setup.role,+e.dataset.id);UI.setup=null;UI.tab="home";save();render();scrollTo(0,0);},
  ngcreate(){UI.setup.step=3;UI.setup.cust={name:"Atlético Palco",short:"ATP",cc:UI.setup.cc||"ESP",c1:"#1b4fbf",c2:"#f5f5f5",s:0,p:1,y:1,budget:6e6};render();scrollTo(0,0);},
  ng2b(){UI.setup.step=2;render();},
  cc1(e){readCust();UI.setup.cust.c1=e.dataset.k;render();},cc2(e){readCust();UI.setup.cust.c2=e.dataset.k;render();},
  cs(e){readCust();UI.setup.cust.s=+e.dataset.k;render();},cp(e){readCust();UI.setup.cust.p=+e.dataset.k;render();},cy(e){readCust();UI.setup.cust.y=+e.dataset.k;render();},
  cb(e){readCust();UI.setup.cust.budget=+e.dataset.k;render();},
  cgo(){readCust();const o=UI.setup.cust;if(!o.name.trim()){toast("Ponle nombre a tu club");return;}o.short=(o.short||shortName(o.name)).toUpperCase();startGame(UI.setup.role,null,o);UI.setup=null;UI.tab="home";save();render();scrollTo(0,0);}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t);}});
document.addEventListener("change",e=>{if(e.target.id==="lgsel"){UI.lgId=e.target.value;UI.round=null;render();}});
document.addEventListener("input",e=>{if((e.target.id==="cs"||e.target.id==="cn")&&UI.setup&&UI.setup.cust){readCust();const o=UI.setup.cust;const s=(o.short||shortName(o.name)||"NEW").toUpperCase().slice(0,3);$("#cprev").innerHTML=crest({id:0,short:s,col:[o.c1,o.c2],crest:{s:o.s,p:o.p,y:o.y}},120);}if(e.target.id==="btk"&&G&&G.fin){const old=G.fin.ticket;G.fin.ticket=clamp(Math.round(num("btk")),5,300);const a=attendance();G.fin.ticket=old;const el=$("#attEst");if(el)el.textContent=`Asistencia estimada: ${a.toLocaleString("es")} (${Math.round(100*a/uc().cap)}%) · taquilla ≈ ${fmt(a*num("btk"))}`;}});
window.addEventListener("load",()=>{render();try{if("serviceWorker" in navigator&&location.protocol==="https:"&&location.hostname.endsWith("github.io"))navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}});
</script></body></html>
